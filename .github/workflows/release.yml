name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # Cheap and first, so a misplaced tag fails in seconds.
  guard:
    uses: pflege-de-labs/github-workflows/.github/workflows/release-guard.yml@cef33cface64a7ac3c33a5a8aea652095de518f7 # v1.1.0

  # The release rebuilds its artifacts, so the tagged commit is gated here.
  verify:
    needs: guard
    uses: pflege-de-labs/github-workflows/.github/workflows/go-checks.yml@cef33cface64a7ac3c33a5a8aea652095de518f7 # v1.1.0
    with:
      go-version: stable
      golangci-lint-version: v2.14.0

  # version-check stays off: the binary is a server and has no --version flag.
  image:
    needs: verify
    uses: pflege-de-labs/github-workflows/.github/workflows/image-release.yml@cef33cface64a7ac3c33a5a8aea652095de518f7 # v1.1.0
    permissions:
      contents: read
      packages: write
      id-token: write

  # Client scripts as release assets (ADR 14); after the image, so a release implies its image exists.
  client:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Byte-reproducible: the devcontainer feature pins the sha256, and a re-run re-uploads the tarball.
      - name: Package the client scripts
        run: |
          sed -i "s/^version=dev /version=${GITHUB_REF_NAME#v} /" plugins/agent-token/bin/agent-token
          grep -q "^version=${GITHUB_REF_NAME#v} " plugins/agent-token/bin/agent-token
          mkdir dist
          tar -C plugins/agent-token --sort=name --mtime="@$(git log -1 --format=%ct)" --owner=0 --group=0 --numeric-owner -cf - bin \
            | gzip -n > "dist/agent-token-${GITHUB_REF_NAME#v}.tar.gz"
          (cd dist && sha256sum agent-token-*.tar.gz > checksums.txt)

      # A suffixed tag is a pre-release, the same predicate image-release uses for :latest, so the two never disagree.
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
          files: dist/*

  # As the agent app, so the PR runs CI and needs a human review; same repo, so the OIDC token fits (ADR 15).
  formula:
    needs: client
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ${{ vars.AGENT_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - name: Open a PR that bumps the Homebrew formula
        env:
          BROKER: ${{ vars.AGENT_TOKEN_BROKER_ACTIONS_URL }}
        run: |
          v=${GITHUB_REF_NAME#v}
          sha=$(curl -fsSL "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/checksums.txt" |
            awk -v f="agent-token-$v.tar.gz" '$2 == f { print $1 }')
          [[ $sha =~ ^[0-9a-f]{64}$ ]]
          sed -i -E "s#/download/v[^/]+/agent-token-[^/]+\.tar\.gz\"#/download/$GITHUB_REF_NAME/agent-token-$v.tar.gz\"#; s#^  sha256 \"[0-9a-f]{64}\"#  sha256 \"$sha\"#" Formula/agent-token.rb
          git diff --exit-code --quiet Formula/agent-token.rb && { echo "formula already at $GITHUB_REF_NAME"; exit; }
          grep -q "agent-token-$v.tar.gz" Formula/agent-token.rb

          oidc=$(curl -fsS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=token-broker" | jq -r .value)
          GH_TOKEN=$(curl -fsS "$BROKER/token/actions" -H "Authorization: Bearer $oidc" \
            -d "{\"repo\":\"$GITHUB_REPOSITORY\"}" | jq -er .token)
          echo "::add-mask::$GH_TOKEN"
          export GH_TOKEN
          branch=chore/formula-$v
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/heads/$branch" -f sha="$(git rev-parse HEAD)" >/dev/null
          # The contents API commits as the agent app, and GitHub signs that commit.
          gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/Formula/agent-token.rb" \
            -f branch="$branch" -f message="chore(formula): agent-token $v" \
            -f sha="$(git rev-parse HEAD:Formula/agent-token.rb)" \
            -f content="$(base64 -w0 Formula/agent-token.rb)" >/dev/null
          gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" \
            --title "chore(formula): agent-token $v" \
            --body "Points the Homebrew formula at the $GITHUB_REF_NAME client tarball. Opened by the release workflow."

  # Docs for a release live on pages-vX.Y; see AGENTS.md on the pages branch.
  docs:
    needs: client
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Create and deploy the docs branch for this minor
        run: |
          if [[ ! $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "$TAG is a pre-release; its docs stay on pages"
            exit 0
          fi
          minor=${TAG%.*}
          branch=pages-$minor
          if gh api "repos/$REPO/branches/$branch" --silent 2>/dev/null; then
            echo "$branch exists"
            exit 0
          fi
          newest=$(git ls-remote --tags --refs "https://github.com/$REPO" 'v*' |
            sed -n 's#.*refs/tags/\(v[0-9][0-9]*\.[0-9][0-9]*\)\.[0-9][0-9]*$#\1#p' | sort -uV | tail -1)
          if [[ $minor != "$newest" ]]; then
            echo "::warning::$branch is missing, but $newest is newer; create it by hand from the right commit"
            exit 0
          fi
          sha=$(gh api "repos/$REPO/git/ref/heads/pages" --jq .object.sha)
          gh api "repos/$REPO/git/refs" -f ref="refs/heads/$branch" -f sha="$sha" --silent
          # A push by GITHUB_TOKEN starts no workflow, so the deploy is dispatched instead.
          gh workflow run docs-deploy.yml --repo "$REPO" --ref "$branch"
          echo "Created $branch from pages@${sha::7} and dispatched docs-deploy"

  # Reports, never gates: an outage there must not withhold the release.
  secobserve:
    needs: image
    uses: pflege-de-labs/github-workflows/.github/workflows/secobserve-image.yml@cef33cface64a7ac3c33a5a8aea652095de518f7 # v1.1.0
    permissions:
      contents: read
      packages: read
    with:
      image: ${{ needs.image.outputs.image }}
      digest: ${{ needs.image.outputs.digest }}
      tag: ${{ github.ref_name }}
    secrets:
      SO_API_TOKEN: ${{ secrets.SO_API_TOKEN }}
