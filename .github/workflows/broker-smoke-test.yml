name: Broker smoke test

# End-to-end check of the Actions path: OIDC token -> broker -> agent token for this repo only.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/broker-smoke-test.yml

permissions:
  contents: read
  id-token: write

jobs:
  token:
    runs-on: ${{ vars.AGENT_RUNNER || 'ubuntu-latest' }}
    steps:
      - name: Get agent token
        id: agent
        env:
          TOKEN_BROKER_URL: ${{ vars.TOKEN_BROKER_URL }}
        run: |
          test -n "$TOKEN_BROKER_URL" || { echo "::error::Actions variable TOKEN_BROKER_URL is not set"; exit 1; }
          oidc=$(curl -fsS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=token-broker" | jq -r .value)
          # Claims are not secret; they show which sub format the broker had to accept.
          jq -R 'split(".")[1] | gsub("-"; "+") | gsub("_"; "/") | @base64d | fromjson | {sub, repository, ref, job_workflow_ref}' <<<"$oidc"
          resp=$(curl -sS -w '\n%{http_code}' "$TOKEN_BROKER_URL" -H "Authorization: Bearer $oidc" \
            -d "{\"repo\":\"$GITHUB_REPOSITORY\"}")
          status=${resp##*$'\n'}
          body=${resp%$'\n'*}
          [ "$status" = 200 ] || { echo "::error::broker returned $status: $body"; exit 1; }
          token=$(jq -r .token <<<"$body")
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
          echo "expires_at: $(jq -r .expires_at <<<"$body")"

      - name: Token covers only this repo
        env:
          GH_TOKEN: ${{ steps.agent.outputs.token }}
        run: |
          test -n "$GH_TOKEN" || { echo "::error::token did not reach this step"; exit 1; }
          repos=$(gh api /installation/repositories --jq '[.repositories[].full_name] | join(",")')
          echo "token repos: $repos"
          [ "$repos" = "$GITHUB_REPOSITORY" ] || { echo "::error::expected only $GITHUB_REPOSITORY"; exit 1; }
