{{- if .Values.actionsRoute.enabled -}}
{{- $fullName := include "token-broker.fullname" . -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullName }}-actions
  labels:
    {{- include "token-broker.labels" . | nindent 4 }}
    {{- with .Values.actionsRoute.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.actionsRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if not .Values.actionsRoute.parentRefs }}
  {{- fail "actionsRoute.parentRefs is required when actionsRoute is enabled" }}
  {{- end }}
  parentRefs:
    {{- toYaml .Values.actionsRoute.parentRefs | nindent 4 }}
  {{- with .Values.actionsRoute.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    # Exactly one path and method: the login, probe and metrics endpoints never become public.
    - matches:
        - path:
            type: Exact
            value: {{ .Values.actionsRoute.path | quote }}
          method: POST
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplaceFullPath
              replaceFullPath: /token/actions
      backendRefs:
        - group: ''
          kind: Service
          name: {{ $fullName }}
          port: {{ .Values.service.port }}
          weight: 1
{{- end }}
