{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "token-broker.fullname" . }}
  labels:
    {{- include "token-broker.labels" . | nindent 4 }}
type: Opaque
data:
  private-key.pem: {{ required "secret.privateKey is required unless existingSecret is set" .Values.secret.privateKey | b64enc | quote }}
  login-client-secret: {{ required "secret.loginClientSecret is required unless existingSecret is set" .Values.secret.loginClientSecret | b64enc | quote }}
{{- end }}
